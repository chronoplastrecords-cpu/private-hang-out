<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private Hangout</title>
    <script src="/js/socket.io/socket.io.js"></script>
    <script src="/js/peerjs/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; height: 100vh; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; }
        
        .header { padding: 10px 20px; background: #1e1e1e; border-bottom: 1px solid #2d2d2d; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .controls { display: flex; gap: 8px; flex: 1; min-width: 250px; }
        #yt-input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; }
        #yt-input:focus { border-color: #4CAF50; outline: none; }
        button { padding: 8px 15px; border-radius: 5px; border: none; background: #4CAF50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .video-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #player { flex: 1; width: 100%; background: #000; }
        
        .video-chat-section { height: 150px; background: #1a1a1a; border-top: 1px solid #2d2d2d; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .video-chat-section h4 { margin: 0 0 8px 0; font-size: 0.85rem; color: #4CAF50; }
        #video-container { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 5px 0; }
        #video-container::-webkit-scrollbar { height: 6px; }
        #video-container::-webkit-scrollbar-track { background: #0b0b0b; }
        #video-container::-webkit-scrollbar-thumb { background: #4CAF50; border-radius: 3px; }
        
        .video-tile { position: relative; flex-shrink: 0; width: 140px; height: 100px; background: #0b0b0b; border: 2px solid #333; border-radius: 6px; overflow: hidden; }
        .video-tile.speaking { border-color: #4CAF50; box-shadow: 0 0 8px rgba(76, 175, 80, 0.6); }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; }
        .video-tile .user-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.8); padding: 4px; text-align: center; font-weight: bold; color: #4CAF50; font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .sidebar { width: 320px; background: #1e1e1e; border-left: 1px solid #2d2d2d; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-toggle { display: none; background: none; border: none; color: #e0e0e0; font-size: 1.5rem; padding: 5px 10px; }

        .sidebar-content { display: flex; flex-direction: column; overflow-y: auto; padding: 15px; gap: 15px; }
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-track { background: #0b0b0b; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #4CAF50; border-radius: 3px; }

        .username-box { padding: 10px; background: #2a2a2a; border-radius: 5px; border: 1px solid #444; }
        .username-box h3 { margin: 0 0 8px 0; font-size: 0.95rem; }
        .username-box input { width: 100%; padding: 8px; border-radius: 3px; border: 1px solid #444; background: #1a1a1a; color: white; margin-bottom: 8px; }
        .username-box button { width: 100%; }

        .voice-box { padding: 10px; background: #2a2a2a; border-radius: 5px; border: 1px solid #444; }
        .voice-box h3 { margin: 0 0 8px 0; font-size: 0.95rem; }
        .voice-box p { margin: 5px 0; font-size: 0.85rem; }
        #room-id, #peer-id { font-weight: bold; color: #4CAF50; background: #111; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .voice-box input { width: 100%; padding: 8px; border-radius: 3px; border: 1px solid #444; background: #1a1a1a; color: white; margin-bottom: 8px; }
        .voice-box button { width: 100%; }

        .user-list { padding: 10px; background: #1a1a1a; border-radius: 5px; border: 1px solid #444; }
        .user-list h4 { margin: 0 0 8px 0; color: #4CAF50; font-size: 0.85rem; }
        #user-list { max-height: 100px; overflow-y: auto; }
        .user-item { padding: 5px; font-size: 0.8rem; color: #b0b0b0; border-left: 2px solid #4CAF50; padding-left: 8px; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
        .user-item img { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }

        #chat-box { flex: 1; overflow-y: auto; padding: 10px; background: #0b0b0b; border-radius: 5px; border: 1px solid #333; margin-bottom: 8px; }
        .chat-msg { margin-bottom: 8px; font-size: 0.85rem; line-height: 1.4; }
        .chat-msg strong { color: #4CAF50; }
        
        .chat-input-section { display: flex; gap: 5px; }
        #chat-input { flex: 1; padding: 8px; border-radius: 3px; border: 1px solid #444; background: #1a1a1a; color: white; }
        #chat-input:focus { border-color: #4CAF50; outline: none; }

        input { font-size: 0.9rem; }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar { width: 280px; }
            .sidebar-content { padding: 12px; gap: 12px; }
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; }
            .controls { min-width: 100%; }
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 300px; border-left: none; border-top: 1px solid #2d2d2d; }
            .video-section { flex: 1; }
            .video-chat-section { height: 120px; }
            .video-tile { width: 120px; height: 90px; }
            .sidebar-toggle { display: block; }
        }

        @media (max-width: 480px) {
            .header { padding: 8px 12px; gap: 6px; }
            .controls input, button { padding: 6px 8px; font-size: 0.85rem; }
            .video-chat-section { height: 100px; padding: 8px; }
            .video-tile { width: 100px; height: 75px; }
            .sidebar { max-height: 250px; }
            .sidebar-content { padding: 10px; gap: 10px; }
            .username-box, .voice-box, .user-list { padding: 8px; }
            .username-box h3, .voice-box h3 { font-size: 0.9rem; }
            #chat-box { min-height: 120px; }
        }

        .hidden-sidebar { display: none; }

        .playlist-box { padding: 10px; background: #2a2a2a; border-radius: 5px; border: 1px solid #444; }
        .playlist-box h3 { margin: 0 0 8px 0; font-size: 0.95rem; }
        #playlist { max-height: 150px; overflow-y: auto; background: #1a1a1a; border-radius: 3px; border: 1px solid #333; }
        .playlist-item { padding: 8px; margin-bottom: 4px; background: #252525; border-left: 3px solid #4CAF50; border-radius: 3px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
        .playlist-item:hover { background: #2a2a2a; }
        .playlist-item.current { background: #4CAF50; color: #000; font-weight: bold; border-left-color: #fff; }
        .playlist-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-item-delete { background: #ff6b6b; border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; }
        .playlist-item-delete:hover { background: #ff5252; }
        /* Participants strip below video */
        .participants-strip { display:flex; gap:10px; padding: 10px; background: transparent; align-items:flex-start; overflow-x:auto; flex-wrap:wrap; max-height:240px; overflow-y:auto; }
        .participant-tile { display:flex; flex-direction:column; align-items:center; width:84px; color:#e0e0e0; font-size:0.8rem; flex:0 0 84px; }
        .participant-avatar { width:56px; height:56px; border-radius:50%; border:2px solid #222; background:#222; object-fit:cover; }
        .participant-name { margin-top:6px; max-width:80px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .participant-owner { color:#FFD54F; font-weight:700; font-size:0.7rem; margin-left:4px; }

        @media (max-width: 720px) {
            .participants-strip { gap:8px; padding:8px; max-height:200px; }
            .participant-tile { width:72px; flex:0 0 72px; }
            .participant-avatar { width:48px; height:48px; }
            .participant-name { max-width:68px; font-size:0.75rem; }
        }
        /* Toast */
        #toast { position: fixed; top: 18px; right: 18px; background: #323232; color: #fff; padding: 10px 14px; border-radius: 6px; opacity: 0; transition: opacity 180ms ease-in-out; z-index: 200; }
    </style>
</head>
<body>
    <div id="login-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:60;">
        <div style="background:#111;padding:20px;border-radius:8px;width:320px;color:#e0e0e0;">
            <h2 style="margin-top:0;margin-bottom:8px;color:#4CAF50;">Join a Hangout</h2>
            <label style="font-size:0.9rem;display:block;margin-bottom:6px;">Display name</label>
            <input id="overlay-username" style="width:100%;padding:8px;margin-bottom:8px;border-radius:4px;border:1px solid #333;background:#0b0b0b;color:#e0e0e0;" placeholder="Your name">
            <label style="font-size:0.9rem;display:block;margin-bottom:6px;">Room ID (or create one)</label>
            <div style="display:flex;gap:8px;margin-bottom:8px;"><input id="overlay-room" style="flex:1;padding:8px;border-radius:4px;border:1px solid #333;background:#0b0b0b;color:#e0e0e0;" placeholder="your-room-id"><button onclick="createRoomFromInput()" style="background:#2196F3;padding:8px;border-radius:4px;border:none;">Create</button></div>
            <div style="display:flex;gap:8px;"><button onclick="joinExistingRoom(false)" style="flex:1;background:#4CAF50;padding:8px;border-radius:4px;border:none;">Join Room</button><button onclick="joinExistingRoom(true)" style="flex:1;background:#607D8B;padding:8px;border-radius:4px;border:none;">Join as Guest</button></div>
            <div id="overlay-error" style="height:18px;margin-top:8px;color:#ff8a80;font-size:0.85rem;"></div>
            <p id="overlay-note" style="margin-top:6px;color:#9e9e9e;font-size:0.85rem;">Create a short ID to invite friends or paste a link you received.</p>
        </div>
    </div>
    <div class="header">
        <div class="controls">
            <input type="text" id="yt-input" placeholder="Enter YouTube/Vimeo/Bandcamp/Uguu URL or ID...">
            <button onclick="changeVideo()">Load Video</button>
            <button onclick="addToQueue()" style="background:#2196F3;">Add to Queue</button>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰ Chat</button>
    </div>

    <div id="toast"></div>

    <div class="main-container">
        <div class="video-section">
            <div id="player"></div>
            <div id="participants-strip" class="participants-strip" aria-label="Participants"></div>
            <div class="video-chat-section">
                <h4>Video Participants</h4>
                <div id="video-container"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-content">
                        <div class="username-box">
                            <h3>Your Name</h3>
                            <input type="text" id="username-input" placeholder="Enter your name...">
                            <button onclick="setUsername()">Set Name</button>

                            <div style="margin-top:10px;">
                                <h3 style="margin:10px 0 6px 0;">Media Setup</h3>
                                <p style="margin:4px 0 8px 0;">Join with audio, video, or text-only.</p>
                                <button onclick="requestMediaAccess('audio')">Join Audio</button>
                                <button onclick="requestMediaAccess('video')" style="margin-top: 6px;">Join Video</button>
                                <button onclick="requestMediaAccess('audio-video')" style="margin-top: 6px;">Join Audio + Video</button>
                                <button onclick="requestMediaAccess('none')" style="margin-top: 6px; background: #607D8B;">Text Only</button>
                                <p id="media-status" style="margin-top: 8px; color: #4CAF50; font-size: 0.8rem;">Choose a media option to join.</p>
                                <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
                                    <div style="font-size:0.75rem;color:#e0e0e0;">Room ID: <span id="room-id">—</span></div>
                                    <button onclick="copyInvite()" style="background:#2196F3;padding:6px;border-radius:4px;border:none;color:white;font-size:0.8rem;">Copy Invite</button>
                                </div>
                                <p style="margin-top: 2px; font-size: 0.65rem; color:#9e9e9e;">Peer ID: <span id="peer-id">—</span></p>
                            </div>
                        </div>

                <div style="flex: 1; display: flex; flex-direction: column; min-height: 200px;">
                    <h3 style="margin: 0 0 8px 0; font-size: 0.95rem;">Text Chat</h3>
                    <div id="chat-box"></div>
                    <div class="chat-input-section">
                        <input type="text" id="chat-input" placeholder="Message..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>

                <div class="user-list">
                    <h4>Connected Users</h4>
                    <div id="user-list"></div>
                </div>

                <div class="playlist-box">
                    <h3>Watch History</h3>
                    <div id="playlist"></div>
                </div>

                <div class="playlist-box queue-box">
                    <h3>Queue</h3>
                    <div id="queue"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });
        let myUsername = 'Anonymous';
        let currentRoomId = null;
        let playlist = [];
        let currentPlayingIndex = -1;
        let queue = [];

        // Toggle sidebar on mobile
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('hidden-sidebar');
        }

        // --- 0. USERNAME MANAGEMENT ---
        function setUsername() {
            const input = document.getElementById('username-input');
            if(input.value.trim() !== '') {
                myUsername = input.value.trim();
                if (currentRoomId) socket.emit('set-username', myUsername);
                input.value = '';
                document.getElementById('overlay-username').value = '';
                updateMediaStatus('Name set: ' + myUsername);
            }
        }

        function generateRoomId(len = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let out = '';
            for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
            return 'r-' + out;
        }

        function createRoomFromInput() {
            const roomInput = document.getElementById('overlay-room');
            const id = (roomInput && roomInput.value.trim()) || '';
            if (!id) {
                const err = document.getElementById('overlay-error'); if (err) err.innerText = 'Please enter a room ID to create.'; return;
            }
            const nameField = document.getElementById('overlay-username');
            let name = (nameField && nameField.value.trim()) || '';
            if (!name) name = 'Host' + Math.floor(Math.random() * 10000);

            currentRoomId = id;
            myUsername = name;
            try { window.history.replaceState({}, '', '?room=' + encodeURIComponent(id)); } catch (e) {}

            socket.emit('join-room', { roomId: id, username: name, owner: true });
            if (myPeerId) socket.emit('register-peer', myPeerId);
            document.getElementById('room-id').innerText = id;
            hideOverlay();
            updateMediaStatus('Created and joined room: ' + id);
        }

        function joinExistingRoom(asGuest = false) {
            const roomInput = document.getElementById('overlay-room');
            let room = (roomInput && roomInput.value.trim()) || '';
            if (!room) { const err = document.getElementById('overlay-error'); if (err) err.innerText = 'Please enter the room ID to join.'; return; }
            const nameField = document.getElementById('overlay-username');
            let name = (nameField && nameField.value.trim()) || '';
            if (!name && !asGuest) { const err = document.getElementById('overlay-error'); if (err) err.innerText = 'Please enter a display name or choose Join as Guest.'; return; }
            if (!name) name = 'Guest' + Math.floor(Math.random() * 10000);

            currentRoomId = room;
            myUsername = name;
            try { window.history.replaceState({}, '', '?room=' + encodeURIComponent(room)); } catch (e) {}

            socket.emit('join-room', { roomId: room, username: name, owner: false });
            if (myPeerId) socket.emit('register-peer', myPeerId);
            socket.emit('set-username', myUsername);
            document.getElementById('room-id').innerText = room;
            hideOverlay();
            updateMediaStatus('Joined room: ' + room);
        }

        function hideOverlay() {
            const ov = document.getElementById('login-overlay');
            if (ov) ov.style.display = 'none';
            const err = document.getElementById('overlay-error'); if (err) err.innerText = '';
        }

        // --- 0b. WATCH HISTORY MANAGEMENT ---
        function addToHistory(platform, id, url) {
            const title = getPlaylistTitle(platform, id, url);
            const item = { platform, id, title, timestamp: new Date().toLocaleTimeString() };
            
            // Check if same item was just added (avoid duplicates within 2 seconds)
            if (playlist.length > 0) {
                const lastItem = playlist[playlist.length - 1];
                if (lastItem.platform === platform && lastItem.id === id) {
                    return; // Skip duplicate
                }
            }
            
            playlist.unshift(item); // Add to front
            if (playlist.length > 50) playlist.pop(); // Keep only last 50
            currentPlayingIndex = 0;
            socket.emit('playlist-update', playlist);
            renderPlaylist();
        }

        function getPlaylistTitle(platform, id, url) {
            const short = (id || url || '').toString();
            const title = short.length > 24 ? short.slice(0, 24) + '...' : short;
            switch ((platform||'').toLowerCase()) {
                case 'vimeo': return `Vimeo: ${title}`;
                case 'bandcamp': return `Bandcamp: ${title}`;
                case 'uguu': return `Uguu: ${title}`;
                default: return `YouTube: ${title}`;
            }
        }

        function deleteFromHistory(index) {
            if (currentPlayingIndex === index) {
                currentPlayingIndex = -1;
            } else if (currentPlayingIndex > index) {
                currentPlayingIndex--;
            }
            playlist.splice(index, 1);
            socket.emit('playlist-update', playlist);
            renderPlaylist();
        }

        function replayFromHistory(index) {
            if (index < 0 || index >= playlist.length) return;
            
            const item = playlist[index];
            currentPlayingIndex = index;
            const platform = item.platform || 'youtube';
            const idOrUrl = item.id || item.url;
            loadMedia(platform, idOrUrl, item.url);
            socket.emit('video-change', { platform, id: item.id, url: item.url });
            renderPlaylist();
        }

        function renderPlaylist() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            
            if (playlist.length === 0) {
                playlistDiv.innerHTML = '<div style="padding: 10px; color: #888; text-align: center; font-size: 0.8rem;">Nothing watched yet</div>';
                return;
            }
            
            playlist.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'playlist-item' + (index === currentPlayingIndex ? ' current' : '');
                
                const title = document.createElement('span');
                title.className = 'playlist-item-title';
                // Prepend platform icon
                const icon = (function(p){
                    switch((p||'').toLowerCase()){
                        case 'vimeo': return '🎬 ';
                        case 'bandcamp': return '🎵 ';
                        case 'uguu': return '🔗 ';
                        default: return '▶️ ';
                    }
                })(item.platform);
                title.textContent = icon + (item.title || item.id || 'Unknown');
                title.title = (item.title || item.id || 'Unknown'); // Show full title on hover
                title.onclick = () => replayFromHistory(index);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'playlist-item-delete';
                deleteBtn.textContent = '✕';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteFromHistory(index);
                };
                
                itemDiv.appendChild(title);
                itemDiv.appendChild(deleteBtn);
                playlistDiv.appendChild(itemDiv);
            });
        }

        socket.on('playlist-update', (newPlaylist) => {
            playlist = newPlaylist;
            renderPlaylist();
        });

        // --- 2b. SHARED QUEUE MANAGEMENT (from server) ---
        socket.on('queue-update', (newQueue) => {
            queue = newQueue || [];
            renderQueue();
        });

        function addToQueue() {
            const input = document.getElementById('yt-input').value;
            if (!input) return;
            const parsed = parseInput(input);
            const item = { platform: parsed.platform, id: parsed.id, url: parsed.url, title: getPlaylistTitle(parsed.platform, parsed.id, parsed.url), requestedBy: myUsername };
            socket.emit('queue-add', item);
        }

        function renderQueue() {
            const queueDiv = document.getElementById('queue');
            queueDiv.innerHTML = '';
            if (!queue || queue.length === 0) {
                queueDiv.innerHTML = '<div style="padding: 10px; color: #888; text-align: center; font-size: 0.8rem;">Queue is empty</div>';
                return;
            }

            queue.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'playlist-item';

                const title = document.createElement('span');
                title.className = 'playlist-item-title';
                const icon = (function(p){
                    switch((p||'').toLowerCase()){
                        case 'vimeo': return '🎬 ';
                        case 'bandcamp': return '🎵 ';
                        case 'uguu': return '🔗 ';
                        default: return '▶️ ';
                    }
                })(item.platform);
                title.textContent = icon + (item.title || (item.id || 'Unknown'));
                title.title = `${item.title || item.id} — requested by ${item.requestedBy || 'Anonymous'}`;
                title.onclick = () => replayFromQueue(index);

                const controls = document.createElement('div');

                const upBtn = document.createElement('button');
                upBtn.textContent = '↑';
                upBtn.style = 'margin-right:6px;';
                upBtn.onclick = (e) => { e.stopPropagation(); socket.emit('queue-move', { from: index, to: Math.max(0, index-1) }); };

                const downBtn = document.createElement('button');
                downBtn.textContent = '↓';
                downBtn.style = 'margin-right:6px;';
                downBtn.onclick = (e) => { e.stopPropagation(); socket.emit('queue-move', { from: index, to: Math.min(queue.length-1, index+1) }); };

                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.className = 'playlist-item-delete';
                delBtn.onclick = (e) => { e.stopPropagation(); socket.emit('queue-remove', index); };

                controls.appendChild(upBtn);
                controls.appendChild(downBtn);
                controls.appendChild(delBtn);

                itemDiv.appendChild(title);
                itemDiv.appendChild(controls);
                queueDiv.appendChild(itemDiv);
            });
        }

        function replayFromQueue(index) {
            if (index < 0 || index >= queue.length) return;
            const item = queue[index];
            const platform = item.platform || 'youtube';
            const idOrUrl = item.id || item.url;
            loadMedia(platform, idOrUrl, item.url);
            socket.emit('video-change', { platform, id: item.id, url: item.url });
        }

        // --- 1. TEXT CHAT ROUTINES ---
        function sendMessage() {
            const input = document.getElementById('chat-input');
            if(input.value.trim() !== '') {
                socket.emit('chat-message', { username: myUsername, text: input.value });
                input.value = '';
            }
        }
        
        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        socket.on('chat-message', (data) => {
            const chatBox = document.getElementById('chat-box');
            const username = data.username || 'Anonymous';
            const text = data.text || data; // Support old format too
            chatBox.innerHTML += `<div class="chat-msg"><strong>${username}:</strong> ${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        });

        // --- 2. VIDEO SYNC ---
        let player;
        let currentPlatform = 'youtube';
        let currentMediaId = 'dQw4w9WgXcQ';
        let ytApiReady = false;
        let pendingYouTubeId = null;
        let playerReady = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytApiReady = true;
            if (!player) {
                createYouTubePlayer(currentMediaId);
            } else if (pendingYouTubeId) {
                loadYouTubeVideo(pendingYouTubeId);
            }
        }

        function parseInput(input) {
            const trimmed = input.trim();

            // YouTube ID or URL
            const ytIdRegex = /^[a-zA-Z0-9_-]{11}$/;
            if (ytIdRegex.test(trimmed)) return { platform: 'youtube', id: trimmed, url: null };
            const ytMatch = trimmed.match(/^.*(?:youtu.be\/|youtube.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/))([^#\&\?]{11}).*/);
            if (ytMatch && ytMatch[1]) return { platform: 'youtube', id: ytMatch[1], url: null };

            // Vimeo (numeric id)
            const vimeoMatch = trimmed.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
            if (vimeoMatch && vimeoMatch[1]) return { platform: 'vimeo', id: vimeoMatch[1], url: null };

            // Uguu direct file links (common extensions)
            if (/uguu\.su|uguu\.moe|uguu\.sh/i.test(trimmed) || /\.(mp4|webm|ogg|mp3|m4a)(\?|$)/i.test(trimmed)) {
                return { platform: 'uguu', id: trimmed, url: trimmed };
            }

            // Bandcamp URL
            if (/bandcamp\.com/i.test(trimmed)) {
                return { platform: 'bandcamp', id: trimmed, url: trimmed };
            }

            // Fallback: treat as YouTube-like id or raw url
            return { platform: 'youtube', id: trimmed, url: trimmed };
        }

        function createYouTubePlayer(videoId) {
            if (player && player.destroy) {
                player.destroy();
            }
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    controls: 1,
                    autoplay: 0,
                    modestbranding: 1,
                    rel: 0
                },
                events: {
                    onReady: function(event) {
                        playerReady = true;
                        if (pendingYouTubeId) {
                            const pending = pendingYouTubeId;
                            pendingYouTubeId = null;
                            event.target.loadVideoById(pending);
                        }
                    },
                    onStateChange: function(event) {
                        // YT.PlayerState.ENDED === 0
                        if (typeof YT !== 'undefined' && event.data === YT.PlayerState.ENDED) {
                            // Ask server to advance to next queued item (server will emit video-change)
                            socket.emit('request-next');
                        }
                    },
                    onError: function(event) {
                        console.error('[Hangout] YouTube player error', event.data);
                        document.getElementById('player').innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#e0e0e0;background:#000;padding:20px;text-align:center;">Unable to load YouTube video. Please check the video ID or URL and try again.</div>';
                    }
                }
            });
        }

        function loadYouTubeVideo(videoId) {
            if (!ytApiReady) {
                pendingYouTubeId = videoId;
                if (!player) {
                    createYouTubePlayer(videoId);
                }
                return;
            }

            if (player && playerReady && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
            } else {
                createYouTubePlayer(videoId);
            }
        }

        // --- Vimeo support ---
        let vimeoPlayer = null;
        function loadVimeoVideo(videoId) {
            // Remove existing players
            destroyCurrentPlayer();
            const container = document.getElementById('player');
            const iframe = document.createElement('iframe');
            iframe.src = `https://player.vimeo.com/video/${videoId}?api=1&player_id=vimeo-player`;
            iframe.id = 'vimeo-player';
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.frameBorder = '0';
            iframe.allow = 'autoplay; fullscreen; picture-in-picture';
            container.appendChild(iframe);

            // Load Vimeo Player SDK dynamically if needed
            if (typeof Vimeo === 'undefined') {
                const s = document.createElement('script');
                s.src = 'https://player.vimeo.com/api/player.js';
                s.onload = () => { vimeoPlayer = new Vimeo.Player(iframe); attachVimeoEvents(); };
                document.body.appendChild(s);
            } else {
                vimeoPlayer = new Vimeo.Player(iframe);
                attachVimeoEvents();
            }
        }

        function attachVimeoEvents() {
            if (!vimeoPlayer) return;
            vimeoPlayer.on('ended', function() {
                socket.emit('request-next');
            });
        }

        // --- Uguu (direct file) support ---
        let htmlMediaElement = null;
        function loadUguuMedia(url) {
            destroyCurrentPlayer();
            const container = document.getElementById('player');
            const isAudio = /\.(mp3|m4a|wav|ogg)(\?|$)/i.test(url);
            const el = document.createElement(isAudio ? 'audio' : 'video');
            el.src = url;
            el.controls = true;
            el.autoplay = false;
            el.style.width = '100%';
            el.style.height = '100%';
            el.onended = () => { socket.emit('request-next'); };
            container.appendChild(el);
            htmlMediaElement = el;
        }

        // --- Bandcamp support (best-effort embed / fallback link) ---
        function loadBandcamp(url) {
            destroyCurrentPlayer();
            const container = document.getElementById('player');
            // First, try Bandcamp oEmbed to get an official embed snippet
            const proxyUrl = `/oembed?url=${encodeURIComponent(url)}`;
            fetch(proxyUrl).then(r => r.json()).then(data => {
                if (data && data.html) {
                    container.innerHTML = data.html;
                } else {
                    // Fallback to iframe/link
                    container.innerHTML = `<div style="padding:20px;color:#ddd;display:flex;align-items:center;justify-content:center;height:100%;"><div><p>Unable to embed content.</p><p><a href="${url}" target="_blank" style="color:#4CAF50;">Open on Bandcamp</a></p></div></div>`;
                }
            }).catch(() => {
                // If oEmbed fails (CORS or other), try iframe then fallback to link
                try {
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.width = '100%';
                    iframe.height = '100%';
                    iframe.frameBorder = '0';
                    iframe.allow = 'autoplay; encrypted-media';
                    container.appendChild(iframe);

                    setTimeout(() => {
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow.document;
                        } catch (e) {
                            container.innerHTML = `<div style="padding:20px;color:#ddd;display:flex;align-items:center;justify-content:center;height:100%;"><div><p>Bandcamp embedding may be blocked by the site.</p><p><a href="${url}" target="_blank" style="color:#4CAF50;">Open on Bandcamp</a></p></div></div>`;
                        }
                    }, 800);
                } catch (e) {
                    container.innerHTML = `<div style="padding:20px;color:#ddd;display:flex;align-items:center;justify-content:center;height:100%;"><div><p>Cannot embed Bandcamp.</p><p><a href="${url}" target="_blank" style="color:#4CAF50;">Open on Bandcamp</a></p></div></div>`;
                }
            });
        }

        function destroyCurrentPlayer() {
            // Clear YT player
            try { if (player && player.destroy) { player.destroy(); } } catch (e) {}
            player = null; playerReady = false; pendingYouTubeId = null; ytApiReady = !!window.YT;
            // Clear Vimeo
            try { if (vimeoPlayer && typeof vimeoPlayer.unload === 'function') vimeoPlayer.unload(); } catch (e) {}
            vimeoPlayer = null;
            // Remove HTML5 media
            try { if (htmlMediaElement) { htmlMediaElement.pause(); htmlMediaElement.src = ''; htmlMediaElement.remove(); } } catch (e) {}
            htmlMediaElement = null;
            // Clear container
            const container = document.getElementById('player');
            container.innerHTML = '';
        }

        function changeVideo() {
            const input = document.getElementById('yt-input').value;
            if (!input) return;

            const parsed = parseInput(input);
            currentPlatform = parsed.platform;
            currentMediaId = parsed.id || parsed.url;

            socket.emit('video-change', { platform: parsed.platform, id: parsed.id || parsed.url, url: parsed.url });
            loadMedia(parsed.platform, parsed.id || parsed.url, parsed.url);
            console.log(`[Hangout] Loading ${parsed.platform}: ${parsed.id || parsed.url}`);
        }

        function loadMedia(platform, idOrUrl, url) {
            switch ((platform||'').toLowerCase()) {
                case 'vimeo':
                    addToHistory('vimeo', idOrUrl, url);
                    loadVimeoVideo(idOrUrl);
                    break;
                case 'uguu':
                    addToHistory('uguu', idOrUrl, url);
                    loadUguuMedia(idOrUrl);
                    break;
                case 'bandcamp':
                    addToHistory('bandcamp', idOrUrl, url);
                    loadBandcamp(url || idOrUrl);
                    break;
                default:
                    const finalId = idOrUrl; // YouTube id/url
                    addToHistory('youtube', finalId, url);
                    loadYouTubeVideo(finalId);
                    break;
            }
        }

        socket.on('video-change', (data) => {
            if (!data) return;
            if (typeof data === 'string') {
                const parsed = parseInput(data);
                loadMedia(parsed.platform, parsed.id || parsed.url, parsed.url);
                return;
            }
            const platform = data.platform || 'youtube';
            const id = data.id || data.url || currentMediaId;
            loadMedia(platform, id, data.url);
        });

        // --- 3. WEB RTC VIDEO CHAT ---
        const peer = new Peer(undefined, {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            path: '/',
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });
        let myStream = null;
        let myPeerId = null;
        let myMediaState = { audio: false, video: false };
        let activeStreams = {}; // Track active streams
        let audioContexts = {}; // Track audio analysis for speaker detection
        let connectedPeerIds = new Set();
        let userNamesByPeerId = {};
        let roomMembers = [];
        let mediaSetupInProgress = false;

        // Generate a profile picture based on username
        function generateProfilePicture(username) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
            const hash = username.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const color = colors[hash % colors.length];
            const initials = username.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            
            const canvas = document.createElement('canvas');
            canvas.width = 80;
            canvas.height = 80;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 80, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(initials, 40, 40);
            return canvas.toDataURL();
        }

        function updateMediaStatus(message, isError = false) {
            const status = document.getElementById('media-status');
            if (!status) return;
            status.textContent = message;
            status.style.color = isError ? '#ff8a80' : '#4CAF50';
        }

        function stopCurrentStream() {
            if (myStream) {
                myStream.getTracks().forEach(track => track.stop());
            }
            myStream = null;
        }

        function sendMediaState() {
            socket.emit('set-media-state', myMediaState);
        }

        function getMediaConstraints(mode) {
            switch (mode) {
                case 'video':
                    return { video: true, audio: false };
                case 'audio-video':
                    return { video: true, audio: true };
                case 'none':
                    return null;
                case 'audio':
                default:
                    return { video: false, audio: true };
            }
        }

        // Detect if audio stream is active (user speaking)
        function detectSpeaking(stream) {
            if (!stream || !stream.getAudioTracks || stream.getAudioTracks().length === 0) {
                return () => false;
            }

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamAudioSource(stream);
            source.connect(analyser);
            
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            audioContexts[stream.id] = { analyser, dataArray, audioContext };
            
            const checkVolume = () => {
                analyser.getByteFrequencyData(dataArray);
                const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                return average > 30; // Threshold for speaking
            };
            
            return checkVolume;
        }

        function addVideoTile(streamId, username, isLocal = false, peerId = null) {
            const container = document.getElementById('video-container');
            if (container.querySelector(`[data-stream-id="${streamId}"]`)) {
                return container.querySelector(`[data-stream-id="${streamId}"]`);
            }
            
            const tile = document.createElement('div');
            tile.className = 'video-tile';
            tile.setAttribute('data-stream-id', streamId);
            if (peerId) tile.setAttribute('data-peer-id', peerId);
            tile.setAttribute('data-username', username);
            
            const label = document.createElement('div');
            label.className = 'user-label';
            label.textContent = username;
            
            tile.appendChild(label);
            container.appendChild(tile);
            return tile;
        }

        function attachStreamToTile(tile, stream, username, isLocal = false) {
            if (!tile) return;

            tile.setAttribute('data-username', username);
            const label = tile.querySelector('.user-label');
            if (label) label.textContent = username;

            const existingMedia = tile.querySelector('video,audio,.media-placeholder');
            if (existingMedia) existingMedia.remove();

            const hasVideo = stream && stream.getVideoTracks && stream.getVideoTracks().length > 0;
            const hasAudio = stream && stream.getAudioTracks && stream.getAudioTracks().length > 0;
            if (stream && (hasVideo || hasAudio)) {
                const mediaEl = hasVideo ? document.createElement('video') : document.createElement('audio');
                mediaEl.autoplay = true;
                mediaEl.playsinline = true;
                mediaEl.muted = isLocal;
                mediaEl.srcObject = stream;
                if (hasVideo) {
                    mediaEl.style.width = '100%';
                    mediaEl.style.height = '100%';
                    mediaEl.style.objectFit = 'cover';
                } else if (isLocal) {
                    mediaEl.style.display = 'none';
                }
                tile.insertBefore(mediaEl, label);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'media-placeholder';
                placeholder.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem;">🎙️</div>';
                tile.insertBefore(placeholder, label);
            }
        }

        function ensureLocalTile() {
            if (!myPeerId) return;
            const tile = addVideoTile(myPeerId, 'You (Local)', true, myPeerId);
            attachStreamToTile(tile, myStream, 'You (Local)', true);
            return tile;
        }

        function initiateCall(peerId) {
            if (!peerId || connectedPeerIds.has(peerId) || peerId === myPeerId || !myStream) return;

            connectedPeerIds.add(peerId);
            const call = peer.call(peerId, myStream);
            call.on('stream', (remoteStream) => {
                playVideo(remoteStream, peerId);
            });
            call.on('close', () => {
                connectedPeerIds.delete(peerId);
            });
            call.on('error', (err) => {
                connectedPeerIds.delete(peerId);
                console.warn('Call failed to', peerId, err);
            });
        }

        function syncPeerConnections() {
            if (!myPeerId) return;
            roomMembers.forEach(member => {
                if (member.peerId && member.peerId !== myPeerId) {
                    initiateCall(member.peerId);
                }
            });
        }

        async function requestMediaAccess(mode = 'audio') {
            if (mediaSetupInProgress) return;
            mediaSetupInProgress = true;
            updateMediaStatus('Requesting media access...');

            stopCurrentStream();
            const constraints = getMediaConstraints(mode);
            if (!constraints) {
                myMediaState = { audio: false, video: false };
                myStream = null;
                sendMediaState();
                ensureLocalTile();
                updateMediaStatus('Text-only mode enabled. You can still use chat.');
                mediaSetupInProgress = false;
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                myStream = stream;
                myMediaState = {
                    audio: stream.getAudioTracks().length > 0,
                    video: stream.getVideoTracks().length > 0,
                };
                sendMediaState();
                ensureLocalTile();
                syncPeerConnections();
                const label = myMediaState.video
                    ? (myMediaState.audio ? 'Camera and microphone are live.' : 'Camera only is live.')
                    : 'Microphone only is live.';
                updateMediaStatus(label);
            } catch (err) {
                console.error('Media access failed', err);
                myMediaState = { audio: false, video: false };
                myStream = null;
                sendMediaState();
                ensureLocalTile();
                updateMediaStatus('Media access was blocked. You can still use text chat.', true);
            } finally {
                mediaSetupInProgress = false;
            }
        }

        peer.on('open', (id) => {
            myPeerId = id;
            const pid = document.getElementById('peer-id');
            if (pid) pid.innerText = id;
            socket.emit('register-peer', id); // Register peer ID with server
            sendMediaState();
            ensureLocalTile();
            syncPeerConnections();
        });

        // Handle incoming calls from friends
        peer.on('call', (call) => {
            if (myStream) {
                call.answer(myStream);
            } else {
                call.answer();
            }
            call.on('stream', (remoteStream) => {
                playVideo(remoteStream, call.peer);
            });
            call.on('close', () => {
                connectedPeerIds.delete(call.peer);
            });
        });

        function playVideo(stream, peerId) {
            if (!stream) return;
            activeStreams[stream.id] = { stream, peerId };
            const label = userNamesByPeerId[peerId] || (peerId ? `Peer ${peerId.slice(0, 8)}` : 'Peer');
            const tile = document.getElementById('video-container').querySelector(`[data-stream-id="${stream.id}"]`) || addVideoTile(stream.id, label, false, peerId);
            attachStreamToTile(tile, stream, label, false);

            const checkSpeaking = detectSpeaking(stream);
            setInterval(() => {
                const activeTile = document.getElementById('video-container').querySelector(`[data-stream-id="${stream.id}"]`);
                if (checkSpeaking()) {
                    activeTile?.classList.add('speaking');
                } else {
                    activeTile?.classList.remove('speaking');
                }
            }, 100);
        }

        socket.on('users-list', (users) => {
            roomMembers = users || [];
            const userList = document.getElementById('user-list');
            userList.innerHTML = '';

            const peerIdsNow = new Set();
            const currentUserId = myPeerId;

            users.forEach(u => {
                const username = u.username || 'Anonymous';
                const peerId = u.peerId || null;
                userNamesByPeerId[peerId] = username;

                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                const profileImg = document.createElement('img');
                profileImg.src = generateProfilePicture(username);
                profileImg.style = 'width: 24px; height: 24px; border-radius: 50%; margin-right: 8px; vertical-align: middle;';
                userItem.appendChild(profileImg);
                const isYou = peerId && peerId === currentUserId;
                const ownerTag = u.owner ? ' (owner)' : '';
                const statusText = document.createTextNode(`${username}${isYou ? ' (you)' : ''}${ownerTag}`);
                userItem.appendChild(statusText);
                userList.appendChild(userItem);

                if (peerId) peerIdsNow.add(peerId);
            });

            // Render participants strip under the video
            const participantsStrip = document.getElementById('participants-strip');
            if (participantsStrip) participantsStrip.innerHTML = '';

            users.forEach(u => {
                const username = u.username || 'Anonymous';
                const peerId = u.peerId || null;

                if (participantsStrip) {
                    const tile = document.createElement('div');
                    tile.className = 'participant-tile';

                    const img = document.createElement('img');
                    img.className = 'participant-avatar';
                    img.src = generateProfilePicture(username);
                    img.alt = username;
                    tile.appendChild(img);

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'participant-name';
                    const isYou = peerId && peerId === currentUserId;
                    nameDiv.textContent = `${username}${isYou ? ' (you)' : ''}`;
                    tile.appendChild(nameDiv);

                    if (u.owner) {
                        const ownerBadge = document.createElement('div');
                        ownerBadge.className = 'participant-owner';
                        ownerBadge.textContent = 'OWNER';
                        tile.appendChild(ownerBadge);
                    }

                    participantsStrip.appendChild(tile);
                }
            });

            const videoContainer = document.getElementById('video-container');
            const tiles = Array.from(videoContainer.querySelectorAll('[data-peer-id]'));
            tiles.forEach(t => {
                const p = t.getAttribute('data-peer-id');
                if (p && !peerIdsNow.has(p) && p !== myPeerId) {
                    t.remove();
                    connectedPeerIds.delete(p);
                }
            });

            syncPeerConnections();
        });

        updateMediaStatus('Choose an option above to join with audio, video, or text-only.');

        // Prefill room from URL if present
        (function prefillFromUrl(){
            try{
                const params = new URLSearchParams(window.location.search);
                const r = params.get('room');
                if (r) {
                    const or = document.getElementById('overlay-room');
                    if (or) or.value = r;
                }
            }catch(e){}
        })();

        function copyInvite() {
            if (!currentRoomId) {
                showToast('No room to copy.');
                return;
            }
            const url = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(currentRoomId);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('Invite link copied to clipboard');
                }).catch(() => {
                    showToast('Unable to copy to clipboard');
                });
            } else {
                // Fallback
                const tmp = document.createElement('textarea');
                tmp.value = url;
                document.body.appendChild(tmp);
                tmp.select();
                try { document.execCommand('copy'); showToast('Invite link copied to clipboard'); } catch (e) { showToast('Unable to copy invite link'); }
                tmp.remove();
            }
        }

        // Simple toast
        function showToast(msg, timeout = 2500) {
            const t = document.getElementById('toast');
            if (!t) return updateMediaStatus(msg);
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, timeout);
        }
    </script>
</body>
